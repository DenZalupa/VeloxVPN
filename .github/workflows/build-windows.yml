name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python tests/test_all.py

  build:
    name: Build EXE
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --uac-admin `
            --name VeloxVPN --icon app.ico `
            --add-data "static;static" --add-data "bin;bin" `
            --hidden-import pystray --hidden-import pystray._win32 --collect-submodules pystray `
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloxVPN-windows
          path: dist/VeloxVPN/
          retention-days: 30
